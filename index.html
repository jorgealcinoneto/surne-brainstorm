const storeKey = "surnia-html";

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function abrir(html) {
  document.open();
  document.write(html);
  document.close();
}

function comSaida(html) {
  const botao = '<button type="button" id="surnia-sair" style="position:fixed;top:12px;right:12px;z-index:9999;padding:8px 12px;border:0;border-radius:10px;background:#ffd66b;color:#1a1404;font:650 .9rem system-ui,sans-serif;cursor:pointer">Sair</button><script>document.getElementById("surnia-sair").addEventListener("click",function(){sessionStorage.removeItem("surnia-html");location.replace(location.pathname);});<\/script>';
  if (html.includes("</body>")) return html.replace("</body>", botao + "</body>");
  return html + botao;
}

const guardado = sessionStorage.getItem(storeKey);
if (guardado) abrir(guardado);

document.getElementById("porta").addEventListener("submit", async (event) => {
  event.preventDefault();
  const erro = document.getElementById("erro");
  const botao = event.currentTarget.querySelector("button");
  erro.textContent = "";
  botao.disabled = true;
  botao.textContent = "Conferindo senha…";
  try {
    const senha = new TextEncoder().encode(document.getElementById("senha").value);
    const material = await crypto.subtle.importKey("raw", senha, "PBKDF2", false, ["deriveKey"]);
    const chave = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const claro = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(payload.iv) },
      chave,
      b64ToBytes(payload.ct)
    );
    const html = comSaida(new TextDecoder().decode(claro));
    sessionStorage.setItem(storeKey, html);
    abrir(html);
  } catch {
    erro.textContent = "Senha incorreta.";
    botao.disabled = false;
    botao.textContent = "Entrar";
  }
});
</script>
